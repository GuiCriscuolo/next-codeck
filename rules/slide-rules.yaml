version: "1.0"
system: "Next Codeck"
source: "rules/funcoes-slides.xlsx"
master: "template/codeck-template.pptx"

rules:
  format: "16:9"
  editable: true
  approved_icons_only: true
  approved_photos_only: true
  preserve_master_identity: true
  prefer_native_powerpoint_objects: true

semantic_exclusions:
  historical_timeline:
    use_for: "chronological historical evolution"
    do_not_use_for:
      - process
      - methodology
      - customer_journey
      - operational_flow
  process_roadmap:
    use_for: "process, methodology, journey, workflow or conceptual sequence"
  product_roadmap:
    use_for: "future product releases, features or initiatives by period"

slides:
  1: {function: "Logo", layout: "Cover"}
  2: {function: "Cover", layout: "Simple-Cover-01"}
  3: {function: "Agenda", layout: "Agenda"}
