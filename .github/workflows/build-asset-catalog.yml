name: Build asset catalog

on:
  push:
    paths:
      - "assets/icons/**"
      - "assets/photos/**"
      - "scripts/build_asset_catalog.py"
      - ".github/workflows/build-asset-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build catalog
        run: python scripts/build_asset_catalog.py
      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/asset-catalog.json assets/asset-catalog.md
          git diff --cached --quiet || git commit -m "Auto-update asset catalog"
          git push